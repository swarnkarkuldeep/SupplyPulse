# All tunable parameters. Secrets and connection details live in .env, not here.
seed: 42

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  sample_dir: data/sample
  reports_dir: reports
  raw_file: DataCoSupplyChainDataset.csv
  raw_encoding: latin-1

sample:
  rows: 2500
  stratify_by: [market, shipping_mode]

forecast:
  top_n_categories: 10        # finalised in Phase 3 after checking history and zero weeks
  horizon_weeks: 8
  final_horizon_weeks: 12
  backtest_folds: 5
  seasonal_period: 52
  interval_level: 0.8
  tail_baseline_weeks: 26     # tail detection: baseline window in weeks
  tail_drop_ratio: 0.6        # a week below 60% of the baseline median (and all later weeks) is the tail
  cutoff_override: null       # "YYYY-MM-DD" to force the last usable date instead of auto-detecting
  models: [seasonal_naive, moving_average, sarima, prophet, lightgbm]
  sample_models: [seasonal_naive, moving_average, lightgbm]   # --sample runs: fast, CI-friendly
  sample_folds: 2
  min_history_weeks: 104      # weeks needed before the first backtest origin
  max_zero_week_share: 0.05   # series with more zero weeks than this are too sparse to forecast
  moving_average_window: 8
  sarima_orders: [[0, 0, 0], [1, 0, 0], [1, 0, 1], [0, 1, 1], [1, 1, 1], [2, 1, 0]]  # (p, d, q) grid
  sarima_fourier_k: [0, 2]    # Fourier pairs for yearly seasonality; chosen by AIC with the order
  lgbm_lags: [1, 2, 3, 4, 8, 13]
  lgbm_params: {n_estimators: 300, learning_rate: 0.05, num_leaves: 15, min_child_samples: 20,
                subsample: 0.8, subsample_freq: 1, colsample_bytree: 0.8}
  n_jobs: 1                   # parallel series fits for SARIMA/Prophet (use 2 on Colab)

risk:
  test_fraction: 0.2          # time-based: most recent orders
  cost_false_negative: 5.0    # relative cost of missing a late order
  cost_false_positive: 1.0    # relative cost of a needless intervention

simulation:
  n_sims: 10000
  horizon_weeks: 52
  review_period_weeks: 1
  lead_time_weeks: [1, 2, 3]  # supplier lead time, not customer shipping days
  lead_time_probs: [0.3, 0.5, 0.2]
  holding_cost_pct_per_week: 0.005
  unit_cost_proxy_pct_of_price: 0.6
  service_levels: [0.90, 0.95, 0.98, 0.99]

review_pack:
  top_drivers: 5
